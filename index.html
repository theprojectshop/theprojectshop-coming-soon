<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Project Shop — Engineering Projects. Prototypes. Components. Coming soon.">
<meta name="theme-color" content="#ffffff">
<title>The Project Shop | Coming Soon</title>
<style>
:root{--ink:#111820;--orange:#ff7900;--muted:#536170}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:30px 18px;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(ellipse at center top,#fff8f0 0,#fff 58%)}
main{width:min(850px,100%);text-align:center}.logo{display:block;width:min(590px,95%);height:auto;max-height:290px;object-fit:contain;margin:0 auto 28px}
.tagline{font-size:clamp(13px,2.5vw,20px);letter-spacing:.13em;color:#202a34;margin:0 auto 46px;line-height:1.6}
.status{display:inline-flex;align-items:center;gap:9px;border:1px solid #ffdfc2;background:#fff7ef;border-radius:999px;padding:9px 15px;color:#a74d00;font-weight:700;font-size:12px;letter-spacing:.11em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange)}
h1{font-size:clamp(38px,7vw,66px);letter-spacing:-2px;line-height:1.08;margin:22px 0 16px}
p.copy{font-size:clamp(16px,2.4vw,20px);line-height:1.7;color:var(--muted);margin:0 auto;max-width:620px}
.accent{color:var(--orange);font-weight:700}.footer{margin-top:42px;color:#526170;font-size:12px;font-weight:700;letter-spacing:.28em}.rule{display:inline-block;width:28px;height:1px;background:#9aa7b5;vertical-align:middle;margin:0 12px}
@media(max-width:480px){.logo{margin-bottom:20px}.tagline{letter-spacing:.06em;margin-bottom:34px}h1{letter-spacing:-1.2px}}
</style></head>
<body><main>
<img class="logo" src="logo.png" alt="The Project Shop — Engineering Projects. Prototypes. Components.">
<p class="tagline">Engineering Projects. Prototypes. Components.</p>
<span class="status"><span class="dot"></span> WEBSITE IN PROGRESS</span>
<h1>Under <span class="accent">Development</span></h1>
<p class="copy">We’re building something exciting. Our online store is currently being prepared and will be live soon.</p>
<div class="footer"><span class="rule"></span> THEPROJECTSHOP.ONLINE <span class="rule"></span></div>
</main></body></html>
